# Copy this file outside the package, replace the identity, and adjust only the
# ROS interface names that differ on the physical robot. Wheel geometry, encoder,
# motor-controller, LiDAR, and PID settings belong to their owning ROS drivers.
amr_web_bridge:
  ros__parameters:
    robot_serial_number: REPLACE-WITH-CHASSIS-SERIAL
    robot_display_name: SCUTTLE Robot
    profile_version: scuttle-real-v1
    hardware_contract_mode: physical
    agent_capabilities: navigation,mapping,localization,diagnostics

    pose_topic: /amcl_pose
    map_topic: /map
    odom_topic: /odom
    scan_topic: /scan
    battery_topic: /battery_state
    physical_estop_topic: /safety/physical_estop
    physical_estop_stale_seconds: 2.0
    diagnostics_topic: /diagnostics
    path_topic: /plan
    navigate_action: /navigate_to_pose
    compute_path_action: /compute_path_to_pose
    load_map_service: /map_server/load_map
    initial_pose_topic: /initialpose
    amcl_state_service: /amcl/get_state
    global_localization_service: /reinitialize_global_localization
    emergency_stop_cmd_vel_topic: /cmd_vel
    base_frame: base_footprint

    heartbeat_period: 5.0
    telemetry_period: 1.0
    emergency_stop_zero_rate: 10.0
    mapping_teleop_deadman_seconds: 0.35
