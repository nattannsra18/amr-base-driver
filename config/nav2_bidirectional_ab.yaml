# Experimental overlay for an attended, motors-disabled planning A/B test.
# Apply after nav2_physical.yaml. It is deliberately not referenced by the
# production systemd wrapper.
planner_server:
  ros__parameters:
    planner_plugins: [Bidirectional]
    Bidirectional:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      tolerance: 0.10
      max_planning_time: 2.0
      allow_reverse_expansion: true
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json

controller_server:
  ros__parameters:
    controller_plugins: [ReverseFollowPath]
    ReverseFollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.08
      lookahead_dist: 0.40
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.06
      cost_scaling_dist: 0.45
      cost_scaling_gain: 0.70
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: false
      allow_reversing: true
      stateful: true
