amr_base_serial_bridge:
  ros__parameters:
    port: /dev/ttyAML6
    baud: 115200
    left_cpr: 2362.4
    right_cpr: 2367.0
    # Loaded-floor calibration: 1.94 m actual / 1.9651 m encoder odometry.
    wheel_radius: 0.032085
    # Loaded-floor turn calibration: 355.86 deg odom / 350 deg actual.
    wheel_separation: 0.36094
    # Corrects the stationary magnitude observed near 1.067 g.
    accel_scale: 0.9372
    max_rpm: 90.0
    # Floor evidence shows the minimum PWM drives a 1-8 RPM request at
    # 15-25 RPM. Stop that wheel instead so tight curves use a predictable
    # one-wheel rolling turn rather than drifting almost straight.
    minimum_trackable_rpm: 12.0
    cmd_vel_timeout: 0.25
    # Stop both outputs when a trackable wheel command has no encoder motion.
    # A stop or direction reversal releases the guard for scan-checked recovery.
    stall_guard_min_target_rpm: 20.0
    stall_guard_max_measured_rpm: 3.0
    stall_guard_timeout_seconds: 1.2
    # Nav2's bounded internal recovery can take about 15 seconds before the
    # Agent receives the final abort. Keep the evidence long enough to hand off.
    stall_guard_recent_seconds: 30.0
    # The firmware emits telemetry every 50 ms (20 Hz). Publish every sample so
    # odometry and IMU stay aligned with the EKF's configured 20 Hz update rate.
    telemetry_publish_divisor: 1
    enable_motors: false
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
